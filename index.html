<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#087e9f" />
<title>What can go wrong?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="world" aria-hidden="true">
 <canvas id="landscape" width="640" height="360"></canvas>
 <div id="bird"><div class="bird-sprite"></div></div>
 <div class="scenery"><img class="tree tree-one" src="assests/tree 1.png" alt=""><img class="tree tree-two" src="assests/tree 2.png" alt=""></div>
 <div id="residents"></div>
</div>
<button id="soundToggle" aria-label="Enable sound" aria-pressed="false">Enable sound</button>
<main>
<section id="startScreen" class="screen"><h1>what can go wrong?</h1><button id="mixButton" class="mix-button" aria-label="Mix two animals"><img src="assests/button.png" alt="Mix"></button></section>
<section id="revealScreen" class="screen hidden" aria-live="polite"><div class="reveal-label" id="revealLabel">ANIMAL A</div><div class="reveal-name" id="revealName"></div><div class="reveal-photo-wrap" id="revealPhotoWrap"><img id="revealImage" alt=""></div></section>
<section id="mashScreen" class="screen hidden" aria-live="polite"><div class="topbar"><div>CREATION <span id="generation">001</span></div><div>NEXT MIX IN <span id="countdown">45</span>S</div></div><button id="mixAgainButton">Mix again</button></section>
</main>
<div class="meadow-panel" role="log" aria-live="polite" aria-atomic="true"><span id="mixLog"></span></div>
<div class="impact-flash" id="impactFlash"></div><div class="impact-text" id="impactText">MIX!</div>
<script src="audio.js"></script>
<script src="world.js"></script>
<script>

const animals=[
{name:"Camel",title:"Camel"},{name:"Giraffe",title:"Giraffe"},{name:"Elephant",title:"Elephant"},{name:"Lion",title:"Lion"},{name:"Tiger",title:"Tiger"},{name:"Zebra",title:"Zebra"},{name:"Hippopotamus",title:"Hippopotamus"},{name:"Rhinoceros",title:"Rhinoceros"},{name:"Kangaroo",title:"Kangaroo"},{name:"Koala",title:"Koala"},{name:"Giant Panda",title:"Giant panda"},{name:"Gorilla",title:"Gorilla"},{name:"Chimpanzee",title:"Chimpanzee"},{name:"Orangutan",title:"Orangutan"},{name:"Wolf",title:"Wolf"},{name:"Red Fox",title:"Red fox"},{name:"Brown Bear",title:"Brown bear"},{name:"Rabbit",title:"Rabbit"},{name:"Horse",title:"Horse"},{name:"Cow",title:"Cattle"},{name:"Goat",title:"Goat"},{name:"Sheep",title:"Sheep"},{name:"Pig",title:"Pig"},{name:"Dog",title:"Dog"},{name:"Cat",title:"Cat"},{name:"Otter",title:"Otter"},{name:"Beaver",title:"Beaver"},{name:"Raccoon",title:"Raccoon"},{name:"Deer",title:"Deer"},{name:"Moose",title:"Moose"},{name:"Penguin",title:"Penguin"},{name:"Ostrich",title:"Common ostrich"},{name:"Flamingo",title:"Flamingo"},{name:"Peacock",title:"Peafowl"},{name:"Eagle",title:"Eagle"},{name:"Owl",title:"Owl"},{name:"Parrot",title:"Parrot"},{name:"Crow",title:"Crow"},{name:"Crocodile",title:"Crocodile"},{name:"Alligator",title:"Alligator"},{name:"Turtle",title:"Turtle"},{name:"Snake",title:"Snake"},{name:"Iguana",title:"Iguana"},{name:"Frog",title:"Frog"},{name:"Salamander",title:"Salamander"},{name:"Shark",title:"Shark"},{name:"Blue Whale",title:"Blue whale"},{name:"Dolphin",title:"Dolphin"},{name:"Octopus",title:"Octopus"},{name:"Squid",title:"Squid"},{name:"Crab",title:"Crab"},{name:"Lobster",title:"Lobster"},{name:"Jellyfish",title:"Jellyfish"},{name:"Butterfly",title:"Butterfly"},{name:"Bee",title:"Bee"},{name:"Beetle",title:"Beetle"},{name:"Dragonfly",title:"Dragonfly"},{name:"Spider",title:"Spider"},{name:"Scorpion",title:"Scorpion"},{name:"Seal",title:"Pinniped"},{name:"Walrus",title:"Walrus"},{name:"Sloth",title:"Sloth"},{name:"Armadillo",title:"Armadillo"},{name:"Anteater",title:"Anteater"},{name:"Llama",title:"Llama"},{name:"Alpaca",title:"Alpaca"}
];
const startScreen=document.getElementById("startScreen"),revealScreen=document.getElementById("revealScreen"),mashScreen=document.getElementById("mashScreen"),mixButton=document.getElementById("mixButton"),mixAgainButton=document.getElementById("mixAgainButton"),revealLabel=document.getElementById("revealLabel"),revealName=document.getElementById("revealName"),revealImage=document.getElementById("revealImage"),revealPhotoWrap=document.getElementById("revealPhotoWrap"),generationText=document.getElementById("generation"),countdownText=document.getElementById("countdown"),impactFlash=document.getElementById("impactFlash"),impactText=document.getElementById("impactText");
let generation=1,countdown=45,timer=null,isRunning=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function randomAnimal(){return animals[Math.floor(Math.random()*animals.length)]}
function mashNames(a,b){const first=a.replace(/\s+/g,""),second=b.replace(/\s+/g,"");const cutA=Math.max(2,Math.ceil(first.length/2)),cutB=Math.floor(second.length/2);return(first.substring(0,cutA)+second.substring(cutB)).toUpperCase()}
async function getAnimalImage(animal){const endpoint="https://en.wikipedia.org/w/api.php";const params=new URLSearchParams({action:"query",format:"json",origin:"*",redirects:"1",prop:"pageimages",piprop:"thumbnail",pithumbsize:"1400",titles:animal.title});const response=await fetch(`${endpoint}?${params.toString()}`,{signal:AbortSignal.timeout(6000)});if(!response.ok)throw new Error(`Wikipedia request failed: ${response.status}`);const data=await response.json();if(!data.query||!data.query.pages)throw new Error(`No page for ${animal.name}`);const page=Object.values(data.query.pages)[0];if(page?.thumbnail?.source)return page.thumbnail.source;throw new Error(`No image for ${animal.name}`)}
function preloadImage(url){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(url);img.onerror=reject;img.src=url})}
function resetRevealAnimation(){revealName.classList.remove("show");revealPhotoWrap.classList.remove("show")}
async function revealAnimal(label,animal,imageUrl){resetRevealAnimation();revealLabel.textContent=label;revealName.textContent=animal.name.toUpperCase();revealImage.src=imageUrl;revealImage.alt=animal.name;await sleep(200);revealName.classList.add("show");await sleep(500);revealPhotoWrap.classList.add("show");playSfx(.55, 1.2);await sleep(2200);resetRevealAnimation();await sleep(550)}
async function dramaticMash(a,b){
  // The photo board belongs only to the parent reveals, never the MIX phase.
  revealScreen.classList.add("hidden");
  resetRevealAnimation();
  mashScreen.classList.add("hidden");
  impactText.textContent="MIX!";
  impactText.classList.add("show");
  await sleep(450);
  impactFlash.style.opacity="1";
  await sleep(120);
  impactFlash.style.opacity="0";
  await sleep(250);
  impactText.classList.remove("show");
  const resultName=mashNames(a.name,b.name);
  playSfx(.8, .75);
  spawnResident(resultName);
  document.getElementById("mixLog").textContent=`${a.name} + ${b.name} = ${resultName}`;
  generationText.textContent=String(generation).padStart(3,"0");
  mashScreen.classList.remove("hidden");
  generation++;
  startCountdown();
}
function startCountdown(){clearInterval(timer);countdown=45;countdownText.textContent=countdown;timer=setInterval(()=>{countdown--;countdownText.textContent=countdown;if(countdown<=0){clearInterval(timer);beginMix()}},1000)}
async function beginMix(){if(isRunning)return;startMusic();playSfx(.65, 1);isRunning=true;clearInterval(timer);startScreen.classList.add("hidden");mashScreen.classList.add("hidden");revealScreen.classList.remove("hidden");revealLabel.textContent="FINDING YOUR ANIMALS";revealName.textContent="SEARCHING...";revealName.classList.add("show");revealPhotoWrap.classList.remove("show");let success=false;for(let attempt=0;attempt<2&&!success;attempt++){let a=randomAnimal(),b=randomAnimal();while(a.title===b.title)b=randomAnimal();try{const[urlA,urlB]=await Promise.all([loadAnimal(a),loadAnimal(b)]);success=true;resetRevealAnimation();await sleep(350);await revealAnimal("ANIMAL A",a,urlA);await revealAnimal("ANIMAL B",b,urlB);await dramaticMash(a,b)}catch(error){console.warn("Retrying specimen search:",error)}}if(!success){revealLabel.textContent="SYSTEM ERROR";revealName.textContent="TRY ANOTHER MIX";revealName.classList.add("show");await sleep(1800);revealScreen.classList.add("hidden");startScreen.classList.remove("hidden")}isRunning=false}
mixButton.addEventListener("click",beginMix);mixAgainButton.addEventListener("click",beginMix);

</script>
</body>
</html>
