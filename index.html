<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Your Specimens</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at center,#2c2924 0%,#151411 55%,#090908 100%);color:#f6f1e7}body{display:flex;align-items:center;justify-content:center}.screen{width:100%;height:100%;position:relative}.hidden{display:none!important}
#startScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}.eyebrow{font-size:14px;letter-spacing:.28em;opacity:.5;margin-bottom:18px}#startScreen h1{margin:0;font-size:clamp(48px,8vw,112px);line-height:.92;text-transform:uppercase;letter-spacing:-.05em;max-width:1100px}.subtitle{margin-top:22px;max-width:650px;font-size:clamp(16px,2vw,22px);line-height:1.5;opacity:.68}#mixButton,#mixAgainButton{margin-top:42px;border:2px solid #f6f1e7;background:transparent;color:#f6f1e7;font-size:22px;font-weight:700;letter-spacing:.12em;padding:18px 44px;border-radius:999px;cursor:pointer;transition:.25s ease;text-transform:uppercase}#mixButton:hover,#mixAgainButton:hover{background:#f6f1e7;color:#111;transform:scale(1.05)}
#revealScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}.reveal-label{font-size:13px;letter-spacing:.3em;opacity:.45;text-transform:uppercase;margin-bottom:14px}.reveal-name{font-size:clamp(50px,8vw,110px);line-height:1;font-weight:900;text-transform:uppercase;letter-spacing:-.05em;margin-bottom:26px;text-align:center;opacity:0;transform:translateY(25px) scale(.94);transition:opacity .7s ease,transform .7s ease}.reveal-name.show{opacity:1;transform:translateY(0) scale(1)}.reveal-photo-wrap{width:min(76vw,780px);height:min(55vh,520px);border:2px solid rgba(255,255,255,.18);border-radius:28px;padding:18px;background:rgba(255,255,255,.045);box-shadow:0 30px 90px rgba(0,0,0,.5);opacity:0;transform:scale(.9);transition:opacity .7s ease,transform .7s ease}.reveal-photo-wrap.show{opacity:1;transform:scale(1)}.reveal-photo-wrap img{width:100%;height:100%;object-fit:contain;display:block;border-radius:18px;background:#0f0f0d}
#mashScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px}.topbar{position:absolute;top:24px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.16em;opacity:.5;pointer-events:none}.mash-heading{text-align:center;z-index:2}.mash-heading .small{font-size:13px;letter-spacing:.28em;opacity:.5;text-transform:uppercase}#creatureName{margin:7px 0 0;font-size:clamp(54px,8vw,112px);line-height:.88;text-transform:uppercase;letter-spacing:-.055em}#parents{margin-top:14px;font-size:clamp(15px,2vw,21px);opacity:.62}.creature-frame{width:min(76vw,820px);height:min(53vh,540px);position:relative;overflow:hidden;margin-top:24px;border-radius:30px;border:2px solid rgba(255,255,255,.16);background:#0d0d0c;box-shadow:0 32px 100px rgba(0,0,0,.55)}.creature-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:14px;transition:opacity 1s ease,transform 2.5s ease,filter 2.5s ease}#animal1{opacity:.72;mix-blend-mode:multiply}#animal2{opacity:.72;mix-blend-mode:screen}.impact-flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:50}.impact-text{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:45;font-size:clamp(70px,14vw,190px);font-weight:900;text-transform:uppercase;letter-spacing:-.06em;opacity:0;transform:scale(.6) rotate(-4deg);transition:opacity .25s ease,transform .25s ease}.impact-text.show{opacity:1;transform:scale(1) rotate(0)}.status{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.08em;opacity:.42}#mixAgainButton{position:absolute;bottom:46px;right:28px;margin:0;padding:11px 20px;font-size:12px;opacity:.72}@media(max-width:700px){.reveal-photo-wrap{width:88vw;height:50vh}.creature-frame{width:90vw;height:48vh}.topbar{left:16px;right:16px;top:16px}#mixAgainButton{right:16px;bottom:45px}}
</style>
</head>
<body>
<section id="startScreen" class="screen"><div class="eyebrow">EXPERIMENTAL SPECIMEN LAB</div><h1>Create Your Specimens</h1><div class="subtitle">Two animals enter. One biologically questionable creature leaves.</div><button id="mixButton">Mix</button></section>
<section id="revealScreen" class="screen hidden"><div class="reveal-label" id="revealLabel">SPECIMEN A</div><div class="reveal-name" id="revealName">CAMEL</div><div class="reveal-photo-wrap" id="revealPhotoWrap"><img id="revealImage" alt=""></div></section>
<section id="mashScreen" class="screen hidden"><div class="topbar"><div>SPECIMEN <span id="generation">001</span></div><div>NEXT MUTATION IN <span id="countdown">45</span>S</div></div><div class="mash-heading"><div class="small">New life-form detected</div><h2 id="creatureName">CAMTOPUS</h2><div id="parents">Camel + Octopus</div></div><div class="creature-frame"><img id="animal1" alt=""><img id="animal2" alt=""></div><button id="mixAgainButton">Mix Again</button><div class="status" id="status">Monitoring specimen...</div></section>
<div class="impact-flash" id="impactFlash"></div><div class="impact-text" id="impactText">MIX!</div>
<script>
const animals=[
{name:"Camel",title:"Camel"},{name:"Giraffe",title:"Giraffe"},{name:"Elephant",title:"Elephant"},{name:"Lion",title:"Lion"},{name:"Tiger",title:"Tiger"},{name:"Zebra",title:"Zebra"},{name:"Hippopotamus",title:"Hippopotamus"},{name:"Rhinoceros",title:"Rhinoceros"},{name:"Kangaroo",title:"Kangaroo"},{name:"Koala",title:"Koala"},{name:"Giant Panda",title:"Giant panda"},{name:"Gorilla",title:"Gorilla"},{name:"Chimpanzee",title:"Chimpanzee"},{name:"Orangutan",title:"Orangutan"},{name:"Wolf",title:"Wolf"},{name:"Red Fox",title:"Red fox"},{name:"Brown Bear",title:"Brown bear"},{name:"Rabbit",title:"Rabbit"},{name:"Horse",title:"Horse"},{name:"Cow",title:"Cattle"},{name:"Goat",title:"Goat"},{name:"Sheep",title:"Sheep"},{name:"Pig",title:"Pig"},{name:"Dog",title:"Dog"},{name:"Cat",title:"Cat"},{name:"Otter",title:"Otter"},{name:"Beaver",title:"Beaver"},{name:"Raccoon",title:"Raccoon"},{name:"Deer",title:"Deer"},{name:"Moose",title:"Moose"},{name:"Penguin",title:"Penguin"},{name:"Ostrich",title:"Common ostrich"},{name:"Flamingo",title:"Flamingo"},{name:"Peacock",title:"Peafowl"},{name:"Eagle",title:"Eagle"},{name:"Owl",title:"Owl"},{name:"Parrot",title:"Parrot"},{name:"Crow",title:"Crow"},{name:"Crocodile",title:"Crocodile"},{name:"Alligator",title:"Alligator"},{name:"Turtle",title:"Turtle"},{name:"Snake",title:"Snake"},{name:"Iguana",title:"Iguana"},{name:"Frog",title:"Frog"},{name:"Salamander",title:"Salamander"},{name:"Shark",title:"Shark"},{name:"Blue Whale",title:"Blue whale"},{name:"Dolphin",title:"Dolphin"},{name:"Octopus",title:"Octopus"},{name:"Squid",title:"Squid"},{name:"Crab",title:"Crab"},{name:"Lobster",title:"Lobster"},{name:"Jellyfish",title:"Jellyfish"},{name:"Butterfly",title:"Butterfly"},{name:"Bee",title:"Bee"},{name:"Beetle",title:"Beetle"},{name:"Dragonfly",title:"Dragonfly"},{name:"Spider",title:"Spider"},{name:"Scorpion",title:"Scorpion"},{name:"Seal",title:"Pinniped"},{name:"Walrus",title:"Walrus"},{name:"Sloth",title:"Sloth"},{name:"Armadillo",title:"Armadillo"},{name:"Anteater",title:"Anteater"},{name:"Llama",title:"Llama"},{name:"Alpaca",title:"Alpaca"}
];
const startScreen=document.getElementById("startScreen"),revealScreen=document.getElementById("revealScreen"),mashScreen=document.getElementById("mashScreen"),mixButton=document.getElementById("mixButton"),mixAgainButton=document.getElementById("mixAgainButton"),revealLabel=document.getElementById("revealLabel"),revealName=document.getElementById("revealName"),revealImage=document.getElementById("revealImage"),revealPhotoWrap=document.getElementById("revealPhotoWrap"),image1=document.getElementById("animal1"),image2=document.getElementById("animal2"),creatureName=document.getElementById("creatureName"),parents=document.getElementById("parents"),generationText=document.getElementById("generation"),countdownText=document.getElementById("countdown"),status=document.getElementById("status"),impactFlash=document.getElementById("impactFlash"),impactText=document.getElementById("impactText");
let generation=1,countdown=45,timer=null,isRunning=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function randomAnimal(){return animals[Math.floor(Math.random()*animals.length)]}
function mashNames(a,b){const first=a.replace(/\s+/g,""),second=b.replace(/\s+/g,"");const cutA=Math.max(2,Math.ceil(first.length/2)),cutB=Math.floor(second.length/2);return(first.substring(0,cutA)+second.substring(cutB)).toUpperCase()}
async function getAnimalImage(animal){const endpoint="https://en.wikipedia.org/w/api.php";const params=new URLSearchParams({action:"query",format:"json",origin:"*",redirects:"1",prop:"pageimages",piprop:"thumbnail",pithumbsize:"1400",titles:animal.title});const response=await fetch(`${endpoint}?${params.toString()}`);if(!response.ok)throw new Error(`Wikipedia request failed: ${response.status}`);const data=await response.json();if(!data.query||!data.query.pages)throw new Error(`No page for ${animal.name}`);const page=Object.values(data.query.pages)[0];if(page?.thumbnail?.source)return page.thumbnail.source;throw new Error(`No image for ${animal.name}`)}
function preloadImage(url){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(url);img.onerror=reject;img.src=url})}
function resetRevealAnimation(){revealName.classList.remove("show");revealPhotoWrap.classList.remove("show")}
async function revealAnimal(label,animal,imageUrl){resetRevealAnimation();revealLabel.textContent=label;revealName.textContent=animal.name.toUpperCase();revealImage.src=imageUrl;revealImage.alt=animal.name;await sleep(200);revealName.classList.add("show");await sleep(500);revealPhotoWrap.classList.add("show");await sleep(2200);resetRevealAnimation();await sleep(550)}
function randomBlendMode(){const modes=["multiply","screen","overlay","soft-light","hard-light"];return modes[Math.floor(Math.random()*modes.length)]}
function randomizeMash(){image1.style.mixBlendMode=randomBlendMode();image2.style.mixBlendMode=randomBlendMode();image1.style.transform=`scale(${.90+Math.random()*.12}) rotate(${Math.random()*5-2.5}deg)`;image2.style.transform=`scale(${.90+Math.random()*.12}) rotate(${Math.random()*5-2.5}deg)`;image1.style.filter=`contrast(${.95+Math.random()*.3}) saturate(${.85+Math.random()*.5})`;image2.style.filter=`contrast(${.95+Math.random()*.3}) saturate(${.85+Math.random()*.5}) hue-rotate(${Math.random()*30-15}deg)`}
async function dramaticMash(a,b,urlA,urlB){revealScreen.classList.add("hidden");impactText.textContent="MIX!";impactText.classList.add("show");await sleep(450);impactFlash.style.opacity="1";await sleep(120);mashScreen.classList.remove("hidden");image1.src=urlA;image2.src=urlB;image1.alt=a.name;image2.alt=b.name;creatureName.textContent=mashNames(a.name,b.name);parents.textContent=`${a.name} + ${b.name}`;generationText.textContent=String(generation).padStart(3,"0");randomizeMash();impactFlash.style.opacity="0";await sleep(250);impactText.classList.remove("show");status.textContent="Specimen stable. Probably.";generation++;startCountdown()}
function startCountdown(){clearInterval(timer);countdown=45;countdownText.textContent=countdown;timer=setInterval(()=>{countdown--;countdownText.textContent=countdown;if(countdown<=0){clearInterval(timer);beginMix()}},1000)}
async function beginMix(){if(isRunning)return;isRunning=true;clearInterval(timer);startScreen.classList.add("hidden");mashScreen.classList.add("hidden");revealScreen.classList.remove("hidden");revealLabel.textContent="SEARCHING FOR SPECIMENS";revealName.textContent="SEARCHING...";revealName.classList.add("show");revealPhotoWrap.classList.remove("show");let success=false;for(let attempt=0;attempt<8&&!success;attempt++){let a=randomAnimal(),b=randomAnimal();while(a.title===b.title)b=randomAnimal();try{const[urlA,urlB]=await Promise.all([getAnimalImage(a),getAnimalImage(b)]);await Promise.all([preloadImage(urlA),preloadImage(urlB)]);success=true;resetRevealAnimation();await sleep(350);await revealAnimal("SPECIMEN A",a,urlA);await revealAnimal("SPECIMEN B",b,urlB);await dramaticMash(a,b,urlA,urlB)}catch(error){console.warn("Retrying specimen search:",error)}}if(!success){revealLabel.textContent="SYSTEM ERROR";revealName.textContent="NO SPECIMEN FOUND";revealName.classList.add("show");await sleep(1800);revealScreen.classList.add("hidden");startScreen.classList.remove("hidden")}isRunning=false}
mixButton.addEventListener("click",beginMix);mixAgainButton.addEventListener("click",beginMix);setInterval(()=>{if(!mashScreen.classList.contains("hidden"))randomizeMash()},5000);
</script>
</body>
</html>
